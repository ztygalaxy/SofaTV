<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>沙发电视</title>
  <desc>青绿色电视、白色屏幕和播放键，右侧保留两条黄色标记与指示灯。背景透明。</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40BBAF"/>
      <stop offset="1" stop-color="#36B3A7"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDFBF8"/>
    </linearGradient>
  </defs>

  <!-- Keep the antenna and perimeter flat so the silhouette reads at Dock sizes. -->
  <g fill="#15A58C">
    <!-- Original asymmetric antennas, fitted to the current placement. -->
    <g transform="translate(288.632 22.376) scale(0.82)">
      <path d="M260 262.4c-5.6 0-11.2-2.4-15.2-6.4L102.4 123.2c-9.6-8.8-9.6-23.2-0.8-32s23.2-9.6 32-0.8l142.4 132.8c9.6 8.8 9.6 23.2 0.8 32-4 4.8-10.4 7.2-16.8 7.2z m69.6 26.4c-4.8 0-9.6-1.6-14.4-4.8-9.6-8-12-22.4-4-32l120-152.8c8-9.6 22.4-12 32-4s12 22.4 4 32L348 280c-4.8 5.6-11.2 8.8-18.4 8.8z"/>
      <path d="M23.2 63.2c0 32.8 26.4 60 60 60s60-26.4 60-60c0-32.8-26.4-60-60-60C50.4 3.2 24 29.6 23.2 63.2zM410.4 84c0 28 23.2 51.2 51.2 51.2 28 0 51.2-23.2 51.2-51.2 0-28-23.2-51.2-51.2-51.2-28 0-51.2 23.2-51.2 51.2z"/>
    </g>
    <path d="M384 238a128 76 0 0 1 256 0z"/>
    <rect x="12" y="238" width="1000" height="766" rx="218"/>
  </g>

  <!-- A broad bezel and right control panel preserve the original proportions. -->
  <rect x="50" y="276" width="924" height="690" rx="180" fill="url(#body)"/>
  <rect x="116" y="366" width="674" height="516" rx="164" fill="url(#screen)"/>
  <path d="M369 533c0-13 14-21 25-14l153 89c12 7 12 24 0 31l-153 89c-11 7-25-1-25-14z" fill="#3DB7AB"/>

  <g fill="#F4BD3E">
    <rect x="832" y="442" width="142" height="48" rx="24"/>
    <rect x="832" y="542" width="142" height="48" rx="24"/>
    <circle cx="884" cy="674" r="23"/>
  </g>
</svg>
